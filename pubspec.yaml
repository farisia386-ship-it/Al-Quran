name: muslim_id
description: "Muslim ID - Premium Islamic Super App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  google_fonts: ^8.1.0
  http: ^1.0.0
  shared_preferences: ^2.0.0
  shimmer: ^3.0.0
  intl: any
  flutter_qiblah: ^3.2.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  geolocator: any
  adhan: ^2.0.0+1
  workmanager: ^0.9.0+3
  vibration: ^3.1.8
  flutter_svg: ^2.3.0
  permission_handler: ^12.0.1
  latlong2: ^0.10.1
  flutter_vibrate: ^1.4.0
  audioplayers: ^6.0.0
  share_plus: ^12.0.2
  hijri: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0D2818"
    theme_color: "#0D2818"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D2818"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/
